name: RinkLens — MoneyPuck stats and community Eye Test
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rinklens-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check MoneyPuck normalization
        run: python -m unittest discover -s tests_moneypuck -v
      - name: Validate public website JavaScript
        run: |
          node --check eye-base.js
          node --check stats-score.js
          node --check source-average.js
          node --check money.js
          node --check eye.js
          node --check cloud.js
          node tests_moneypuck/test_stats_score.js
          node tests_moneypuck/test_pagination.js
          node tests_moneypuck/test_eye_quick_rate.js
          node tests_moneypuck/test_eye_private_score.js
          node tests_moneypuck/test_eye_base.js
          node tests_moneypuck/test_model_contributor.js
          node tests_moneypuck/test_auto_eye_bound.js
          node tests_moneypuck/test_source_average.js
          node tests_moneypuck/test_nst_published.js
      - name: Update MoneyPuck player statistics
        run: python scripts/fetch_moneypuck.py --seasons 20262027 20252026 20242025
      - name: Validate refreshed MoneyPuck 5v5 ice time and score coverage
        run: node tests_moneypuck/test_moneypuck_snapshots.js
      - name: Save refreshed public MoneyPuck snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/moneypuck-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh MoneyPuck-only snapshots'
            git push origin HEAD:main
          fi
      - name: Assemble MoneyPuck stats, composite, and Eye Test website
        run: |
          mkdir -p _site/data
          cp index.html money.css money.js stats-score.js source-average.js eye-base.js eye.css eye.js cloud.js config.js _site/
          cp data/nst-index.json _site/data/
          if ls data/nst-*.json >/dev/null 2>&1; then cp data/nst-*.json _site/data/; fi
          cp data/moneypuck-*.json _site/data/
          touch _site/.nojekyll
          if grep -Ei 'autoscout|community-eye\\.js|scouting-consensus|model-ratings|film-lab|nhl-[0-9]|advanced-[0-9]' _site/index.html; then
            echo 'Unexpected non-MoneyPuck UI dependency' && exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
