name: RinkLens — MoneyPuck-only website
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rinklens-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check MoneyPuck normalization
        run: python -m unittest discover -s tests_moneypuck -v
      - name: Update MoneyPuck player statistics
        run: python scripts/fetch_moneypuck.py --seasons 20262027 20252026 20242025
      - name: Save refreshed public MoneyPuck snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/moneypuck-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh MoneyPuck-only snapshots'
            git push origin HEAD:main
          fi
      - name: Assemble MoneyPuck-only website
        run: |
          mkdir -p _site/data
          cp index.html money.css money.js _site/
          cp data/moneypuck-*.json _site/data/
          touch _site/.nojekyll
          if grep -Ei 'autoscout|community-eye|scouting-consensus|model-ratings|supabase|nhl-[0-9]|advanced-[0-9]' _site/index.html; then
            echo 'Unexpected non-MoneyPuck UI dependency' && exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
