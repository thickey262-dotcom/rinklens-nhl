name: RinkLens — NHL stats and website

on:
  push:
    branches: [main]
  schedule:
    # Approximately 2:17am Eastern during daylight saving time; GitHub scheduling is best-effort.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rinklens-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test NHL data normalization
        run: python -m unittest discover -s tests -v

      - name: Refresh NHL data (daily or manual run)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_nhl.py --seasons 20262027 20252026 20242025

      - name: Refresh MoneyPuck 5v5 advanced stats (non-commercial attribution)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/fetch_advanced.py --seasons 20262027 20252026 20242025

      - name: Build full-league statistical ratings
        run: python scripts/build_full_league_ratings.py

      - name: Recalculate evidence-based scouting consensus
        run: python scripts/build_scouting_consensus.py

      - name: Commit updated real-data snapshots (daily or manual run)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh NHL skater snapshots'
            git push origin HEAD:main
          fi

      # Copy only public website files. Do not publish SQL, tests, or GitHub workflow files.
      - name: Assemble static website
        run: |
          mkdir -p _site/data
          cp index.html styles.css learn.css advanced.css reportcards.css autoscout.css scouting-consensus.css model-ratings.css easy-read.css app.js learn.js advanced.js reportcards.js autoscout.js scouting-consensus.js model-ratings.js easy-read.js cloud.js config.js _site/
          touch _site/.nojekyll
          for file in data/nhl-*.json data/advanced-*.json data/scouting-consensus.json data/model-rating-*.json; do
            if [ -f "$file" ]; then cp "$file" _site/data/; fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy RinkLens to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
